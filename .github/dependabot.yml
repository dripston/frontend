version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels: [dependencies]
    commit-message:
      prefix: 'build'
      include: scope
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
        update-types: [minor, patch]
      next:
        patterns: ['next', 'eslint-config-next', '@next/*']
        update-types: [minor, patch]
      testing:
        patterns:
          ['vitest', '@vitest/*', '@testing-library/*', '@playwright/test', 'jsdom']
        update-types: [minor, patch]
      linting:
        patterns:
          [
            'eslint',
            'eslint-*',
            'prettier',
            'prettier-*',
            '@commitlint/*',
            'lint-staged',
            'husky',
          ]
        update-types: [minor, patch]
      types:
        patterns: ['@types/*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: 'ci'

  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
    labels: [dependencies, docker]
