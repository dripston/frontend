name: Bug report
description: Report something that is not working
labels: [bug, triage]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the exact error message if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit SHA
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where does it happen
      options: [Local development, Preview deployment, Production]
    validations:
      required: true
